<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

body{
    margin:0;
    background:transparent;
    overflow:hidden;
    font-family:'Arial Black','Segoe UI',sans-serif;
}


/* MAIN CONTAINER */

#container{
    position:absolute;
    right:30px;
    top:30px;

    width:300px;
    height:300px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;

    color:white;
}


/* GIFT IMAGE */

#giftImage{
    width:220px;
    height:220px;

    object-fit:contain;
    flex-shrink:0;

    animation:float 2s ease-in-out infinite;
}


/* TEXT OVER THE IMAGE */

#action{

    position:absolute;

    top:170px;
    left:0;

    width:300px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Arial Black','Segoe UI',sans-serif;

    font-size:27px;
    font-weight:900;

    /* Makes the letters feel wider */
    transform:scaleX(1.15);

    letter-spacing:0.5px;

    text-align:center;

    line-height:1.05;

    padding:0 5px;

    box-sizing:border-box;

    /* Strong readable outline */
    text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
         0 0 5px #000,
         0 0 10px #000,
         0 0 16px rgba(0,0,0,0.9);

    z-index:10;

}


/* FADE / POP */

.fade{
    animation:fade 0.7s ease;
}


@keyframes fade{

    0%{
        opacity:0;
        transform:scale(.85);
    }

    60%{
        opacity:1;
        transform:scale(1.04);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }

}


/* FLOATING GIFT */

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

}

</style>

</head>


<body>


<div id="container">

    <img id="giftImage">

    <div id="action"></div>

</div>


<script>


const gifts = [


{
image:"heartme.png",
action:"Totem توتم"
},


{
image:"loveyousomuch.png",
action:"EG Apple / Diamond"
},


{
image:"rose.png",
action:"Random MOBS"
},


{
image:"tiktok.png",
action:"TNT قنبلة"
},


{
image:"rosa.png",
action:"Pearls & Rods"
},


{
image:"perfume.png",
action:"Random Chest صندوق عشواءي"
},


{
image:"doughnut.png",
action:"Random PIT حفرة"
},


{
image:"LoveGlasses.png",
action:"Diamond Loot"
},


{
image:"hearts.png",
action:"No Movement 20 Sec"
},


{
image:"corgi.png",
action:"Wither Boss الوثر"
},


{
image:"Manifesting.png",
action:"OP Loot/Armour"
},


{
image:"monmey gun.png",
action:"1000x TNT & ARROWS RAIN"
},


{
image:"Galaxy.png",
action:"Death Pit حفرة الموت"
}


];


let current = 0;


function updateGift(){

    const gift = gifts[current];

    const img = document.getElementById("giftImage");
    const text = document.getElementById("action");
    const container = document.getElementById("container");


    /* Restart animation */

    container.classList.remove("fade");

    void container.offsetWidth;


    /* Update */

    img.src = gift.image;
    text.textContent = gift.action;


    /* Play animation */

    container.classList.add("fade");


    /* Next gift */

    current = (current + 1) % gifts.length;

}


updateGift();

setInterval(updateGift,5000);


</script>


</body>
</html>
